repoUrl.title=Git Repository URL
repoUrl.description=URL of the Git repository containing the parameter definitions file
credentialsId.title=Credentials ID
credentialsId.description=ID of a username/password credential used to read the repository (leave empty for anonymous access)
paramFilePath.title=Parameter File Path
paramFilePath.description=Path of the Groovy file within the repository that contains a parameters {} block
triggerParamName.title=Trigger Parameter Name
triggerParamName.description=Parameter whose value selects the branch to load parameters from
defaultBranch.title=Default Branch
defaultBranch.description=Branch used when the trigger value does not match any branch or tag
